name: Caçador de Vagas Diário

on:
  schedule:
    # Roda automaticamente nos horários de Brasília (UTC-3):
    # 12:00 UTC = 09:00 BRT
    # 17:00 UTC = 14:00 BRT
    # 22:00 UTC = 19:00 BRT
    - cron: '0 12,17,22 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub quando quiser

permissions:
  contents: write

jobs:
  buscar_e_notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Caçador de Vagas com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: 55
          REMOTE_ONLY: false
        run: |
          python run.py

      - name: Salvar histórico de vagas vistas no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vagas_vistas.json historico_matches.json || true
          git commit -m "chore: atualizar histórico de vagas avaliadas [skip ci]" || echo "Nenhuma alteração no histórico de vagas"
          git push || echo "Nada para enviar"
